name: androidBuild

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          # Setup haxelib
          haxelib setup ~/haxelib
          
          # Install core libraries
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          
          # Install dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib install hxCodec 2.5.1 --quiet
          haxelib install polymod 1.5.0 --quiet
          
          # Git libraries - gunakan URL yang valid dan publik
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git
          
          # Coba beberapa alternatif untuk extension-androidtools
          # Opsi 1: Gunakan versi original jika tersedia
          haxelib git extension-androidtools https://github.com/jigsaw-code/extension-androidtools.git || \
          # Opsi 2: Coba dari repository lain
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git || \
          # Opsi 3: Gunakan haxelib registry
          haxelib install extension-androidtools || \
          echo "Warning: extension-androidtools not found, build might fail"

      - name: Setup Android SDK
        run: |
          # Install SDK platforms jika diperlukan
          if [ ! -d "$ANDROID_HOME/platforms/android-30" ]; then
            echo "Installing Android SDK platform 30..."
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
            $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"
          fi

      - name: Configure Lime & Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Setup lime
          haxelib run lime setup -alias -y
          
          # Configure Android paths
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          
          # Verifikasi konfigurasi
          echo "=== LIME CONFIG ==="
          haxelib run lime config

      - name: Build Android
        env:
          cert_pass: nullfunni
          cert_alias_pass: nullfunni
        run: |
          # Tampilkan library yang terinstall
          echo "=== INSTALLED LIBRARIES ==="
          haxelib list
          
          # Build Android
          haxelib run lime build android -release

      - name: List Build Output
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== AAB FILES ==="
          find . -name "*.aab" -type f 2>/dev/null
          echo "=== EXPORT DIRECTORY ==="
          if [ -d "export" ]; then
            find export -type f | head -50
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: warn


                - name: Debug Info
        run: |
          echo "=== HAXE VERSION ==="
          haxe --version
          echo "=== HAXELIB LIST ==="
          haxelib list
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== PROJECT.XML CONTENT ==="
          cat project.xml | grep -E "haxelib|lib" || echo "No project.xml found"