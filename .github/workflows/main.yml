name: androidBuild

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          # Setup haxelib
          haxelib setup ~/haxelib
          
          # Install core libraries dengan versi yang tepat untuk Psych 0.7.1
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui 2.5.0 --quiet
          haxelib install flixel-tools --quiet
          
          # Install dependencies
          haxelib install hscript 2.4.0 --quiet
          haxelib install hxvlc 1.8.2 --quiet
          haxelib install hxCodec 2.5.1 --quiet
          haxelib install faxe 1.0.0 --quiet
          haxelib install polymod 1.5.0 --quiet
          
          # Git libraries
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git
          haxelib git hxvm-luajit https://github.com/Le0 developer/HxVM-LuaJIT.git
          haxelib git extension-androidtools https://github.com/jigsaw-code/extension-androidtools.git
          haxelib git hxcpp-debug-server https://github.com/SomeRanDev/hxcpp-debug-server.git
          
          # Update flixel jika diperlukan
          haxelib update flixel

      - name: Configure Lime & Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # Setup lime
          haxelib run lime setup -alias -y
          
          # Configure Android paths
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          
          # Setup Android SDK (jika perlu)
          if [ ! -d "$ANDROID_HOME/platforms" ]; then
            echo "Downloading Android SDK platforms..."
            yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses
            $ANDROID_HOME/tools/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3"
          fi

      - name: Build Android
        env:
          cert_pass: nullfunni
          cert_alias_pass: nullfunni
        run: |
          # Jalankan build
          haxelib run lime build android -release -v

      - name: List Build Output
        if: always()
        run: |
          echo "=== APK FILES ==="
          find . -name "*.apk" -type f
          echo "=== AAB FILES ==="
          find . -name "*.aab" -type f
          echo "=== EXPORT DIRECTORY ==="
          if [ -d "export" ]; then
            find export -type f | head -50
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: androidBuild
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: warn