name: androidBuild

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5

      - name: Install Libraries
        run: |
          haxelib setup ~/haxelib

          # Core
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib install flixel 5.2.2 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui 2.5.0 --quiet

          # Dibutuhkan Project.xml (dulu tidak ada di workflow)
          haxelib install tjson --quiet
          haxelib install hxCodec 2.5.1 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install SScript 7.7.0 --quiet

          # Library Android khusus
          haxelib install androiddialogs --quiet || haxelib git androiddialogs https://github.com/nicolastuka/AndroidDialogs
          haxelib install devicelanguage --quiet || haxelib git devicelanguage https://github.com/ipsilondev/devicelanguage

          # Library dari git
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          # Versi lama (Juli 2022): masih punya android.Tools & android.Permissions yang dipakai SUtil.hx
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools 84c01580096efe59d35a9d862cbb1766850dd454

          # openfl.utils.JNI sudah dihapus di OpenFL 9.2; penggantinya lime.system.JNI (API sama)
          for lib in devicelanguage AndroidDialogs extension-androidtools; do
            grep -rl "openfl.utils.JNI" ~/haxelib/$lib 2>/dev/null | xargs -r sed -i 's/openfl\.utils\.JNI/lime.system.JNI/g'
          done

      - name: Debug Info
        run: |
          haxe --version
          haxelib list
          grep -E "haxelib" Project.xml

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"

      - name: Configure Lime & Android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime config

      - name: Build Android
        run: |
          # SScript 7.x menjalankan setup interaktif saat kompilasi pertama lalu sengaja menghentikannya.
          # Jawab N (pengaturan default); percobaan pertama boleh gagal, yang kedua build sungguhan.
          if [ ! -f ~/settings.cocoa ]; then
            printf 'N\nN\nN\nN\n' | haxelib run lime build android -release || true
          fi
          ls -la ~/settings.cocoa
          haxelib run lime build android -release

      - name: Sign APK
        run: |
          BT="$ANDROID_HOME/build-tools/30.0.3"
          APK=$(find export -name "*.apk" | head -1)
          echo "APK mentah: $APK"
          keytool -genkeypair -keystore ci.keystore -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=Psych Engine Port"
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ci.keystore --ks-key-alias ci \
            --ks-pass pass:android --key-pass pass:android \
            --out PsychEngine.apk aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-apk
          path: PsychEngine.apk
          if-no-files-found: error
