name: androidBuild

on:
push:
branches: [ main ]
pull_request:
branches: [ main ]
workflow_dispatch:

jobs:
buildAndroid:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Android NDK
    uses: nttld/setup-ndk@v1
    id: setup-ndk
    with:
      ndk-version: r21e

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: zulu
      java-version: 11

  - name: Setup Haxe
    uses: krdlab/setup-haxe@master
    with:
      haxe-version: 4.2.5

  - name: Install Libraries
    run: |
      haxelib setup ~/haxelib

      haxelib install hxcpp 4.2.1
      haxelib install lime 7.9.0
      haxelib install openfl 9.2.1
      haxelib install flixel 5.2.2
      haxelib install flixel-addons 3.0.2
      haxelib install flixel-ui 2.5.0

      haxelib install tjson
      haxelib install hxjsonast
      haxelib install hscript
      haxelib install SScript 7.7.0

      haxelib git hxCodec https://github.com/SPLCoding/hxCodec-but-it-works-xd.git
      haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
      haxelib git linc_luajit https://github.com/ChyaaIsHere/linc_luajit
      haxelib git extension-androidtools https://github.com/LimeExtensions/extension-androidtools
      haxelib git androiddialogs https://github.com/beihu235/AndroidDialogs
      haxelib git devicelanguage https://github.com/beihu235/devicelanguage

      haxelib list

  - name: Preconfigure SScript
    run: |
      touch /home/runner/settings.cocoa

  - name: Configure Android
    env:
      ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
    run: |
      haxelib run lime setup -alias -y

      haxelib run lime config ANDROID_SDK $ANDROID_HOME
      haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
      haxelib run lime config JAVA_HOME $JAVA_HOME
      haxelib run lime config ANDROID_SETUP true

  - name: Build Android
    env:
      cert_pass: nullfunni
      cert_alias_pass: nullfunni
    run: |
      haxelib run lime build android -release

  - name: Debug Files
    if: always()
    run: |
      echo "=== APK FILES ==="
      find . -iname "*.apk"

      echo "=== AAB FILES ==="
      find . -iname "*.aab"

      echo "=== EXPORT CONTENT ==="
      find export | head -300

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: androidBuild
      path: |
        **/*.apk
        **/*.aab
      if-no-files-found: error
```
