name: probe
on:
  push:
    branches: [fix-android-build]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Install
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp 4.2.1 --quiet
          haxelib install lime 8.0.1 --quiet
          haxelib install openfl 9.2.2 --quiet
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools 84c01580096efe59d35a9d862cbb1766850dd454
      - name: Compile old androidtools alone
        run: |
          set +e
          D=$(haxelib libpath extension-androidtools | head -1)
          mkdir -p t && cd t
          echo "HASIL --- asli"
          haxe -lib lime -D android -cp $D/src -cpp out --no-output android.Permissions 2>&1 | sed 's/^/HASIL P: /'
          echo "HASIL --- Tools"
          haxe -lib lime -D android -cp $D/src -cpp out --no-output android.Tools 2>&1 | sed 's/^/HASIL T: /'
          echo "HASIL --- varian tanpa spasi"
          cp -r $D/src ./src2
          sed -i 's/new Event< Array<String> -> Void>()/new Event<Array<String>->Void>()/' src2/android/Permissions.hx
          haxe -lib lime -D android -cp src2 -cpp out2 --no-output android.Permissions 2>&1 | sed 's/^/HASIL V1: /'
          echo "HASIL --- varian tipe eksplisit"
          cp -r $D/src ./src3
          sed -i 's/public static var onPermissionsGranted = new Event< Array<String> -> Void>();/public static var onPermissionsGranted:Event<Array<String>->Void> = new Event<Array<String>->Void>();/; s/public static var onPermissionsDenied = new Event< Array<String> -> Void>();/public static var onPermissionsDenied:Event<Array<String>->Void> = new Event<Array<String>->Void>();/' src3/android/Permissions.hx
          haxe -lib lime -D android -cp src3 -cpp out3 --no-output android.Permissions 2>&1 | sed 's/^/HASIL V2: /'
          echo "HASIL selesai"
      - name: API SScript
        run: |
          set +e
          for v in 7.0.0 7.7.0; do
            rm -rf ~/haxelib/SScript
            haxelib install SScript $v --quiet --skip-dependencies > /dev/null 2>&1
            d=~/haxelib/SScript/$(echo $v | tr . ,)
            echo "HASIL SScript $v: $(grep -rhoE 'function (kill|destroy|doScript|doString|executeFunction|call|new|preset|execute)\b' $d/src/tea/SScript.hx | sort -u | tr '\n' ' ')"
            echo "HASIL   TeaCall: $(grep -rn 'TeaCall' $d/src | head -2 | tr '\n' '|')"
          done
