name: probe
on:
  push:
    branches: [fix-android-build]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Cari versi SScript yang punya TeaCall
        run: |
          set +e
          haxelib setup ~/haxelib
          haxelib info SScript
          VERS=$(haxelib info SScript | sed -n '/^Releases:/,$p' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)*' | sort -uV)
          echo "HASIL daftar: $(echo $VERS | tr '\n' ' ')"
          for v in $VERS; do
            rm -rf ~/haxelib/SScript
            haxelib install SScript $v --quiet --skip-dependencies > /dev/null 2>&1
            d=~/haxelib/SScript/$(echo $v | tr . ,)
            n=$(grep -rl "TeaCall" "$d" 2>/dev/null | wc -l)
            deps=$(tr -d '\n ' < "$d/haxelib.json" 2>/dev/null | grep -o '"dependencies":{[^}]*}')
            echo "HASIL SScript $v: TeaCall di $n file; $deps"
          done
      - name: Cek AndroidDialogs
        run: |
          haxelib install AndroidDialogs --quiet
          d=$(ls -d ~/haxelib/androiddialogs/* | head -1)
          echo "dir: $d"
          grep -rn "ShowToast\|ShowAlertDialog" "$d" | head -5
