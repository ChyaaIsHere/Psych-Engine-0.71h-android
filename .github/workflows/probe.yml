name: probe
on:
  push:
    branches: [fix-android-build]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Cari versi SScript yang punya TeaCall
        run: |
          haxelib setup ~/haxelib
          for v in 3.0.1 3.0.2 3.0.3 3.1.0 4.0.0 4.0.1 4.1.0 5.0.0 5.1.0 6.0.0 6.1.0 6.1.1 6.1.8 6.1.80 7.0.0 7.0.1 7.0.2 7.0.3 7.1.0 7.7.0 8.0.0 8.1.0 9.0.0 10.0.0; do
            if haxelib install SScript $v --quiet --skip-dependencies > /dev/null 2>&1; then
              d=$(ls -d ~/haxelib/sscript/$(echo $v | tr . ,) 2>/dev/null)
              n=$(grep -rl "TeaCall" "$d" 2>/dev/null | wc -l)
              deps=$(tr -d '\n ' < "$d/haxelib.json" | grep -o '"dependencies":{[^}]*}')
              echo "HASIL SScript $v: TeaCall=$n $deps"
            else
              echo "HASIL SScript $v: tidak ada"
            fi
          done
      - name: Cek AndroidDialogs
        run: |
          haxelib install AndroidDialogs --quiet
          d=$(ls -d ~/haxelib/androiddialogs/* | head -1)
          echo "dir: $d"
          grep -rn "ShowToast\|ShowAlertDialog" "$d" | head -5
