name: probe
on:
  push:
    branches: [fix-android-build]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.2.5
      - name: Cari versi SScript yang punya TeaCall
        run: |
          set +e
          haxelib setup ~/haxelib
          for v in 3.0.0 3.0.3 4.1.0 5.1.0 6.1.80 7.0.0 7.7.0; do
            haxelib install SScript $v --quiet --skip-dependencies > /dev/null 2>&1
            d=$(find ~/haxelib -maxdepth 2 -iname "$(echo $v | tr . ,)" -path "*sscript*" | head -1)
            echo "HASIL SScript $v dir=[$d]"
            [ -z "$d" ] && continue
            echo "HASIL   file: $(find "$d" -name '*.hx' | sed "s#$d/##" | head -12 | tr '\n' ' ')"
            echo "HASIL   TeaCall: $(grep -rn 'TeaCall' "$d" | head -3 | tr '\n' '|')"
            echo "HASIL   typedef: $(grep -rhn 'typedef .*Call\|typedef Tea' "$d" | head -4 | tr '\n' '|')"
            echo "HASIL   deps: $(tr -d '\n ' < "$d/haxelib.json" | grep -o '"dependencies":{[^}]*}')"
          done
      - name: Cek AndroidDialogs
        run: |
          haxelib install AndroidDialogs --quiet
          d=$(ls -d ~/haxelib/androiddialogs/* | head -1)
          echo "dir: $d"
          grep -rn "ShowToast\|ShowAlertDialog" "$d" | head -5
